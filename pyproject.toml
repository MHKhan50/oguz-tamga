[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "turkicbridge"
version = "0.1.0"
description = "Cross-lingual evidence retrieval with abstention for five Turkic languages"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Muzammal Hussain"}]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "pandas>=1.5", "pyarrow>=12", "huggingface_hub>=0.20"]

[project.optional-dependencies]
dense = ["sentence-transformers>=2.7"]

[project.scripts]
turkicbridge = "turkicbridge.cli:main"

[tool.setuptools]
packages = ["turkicbridge"]
